<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grow Tent</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>🌱 Smart Grow Tent</h1>

        <div class="online-status">
            <span class="dot"></span>
            ONLINE
        </div>

        <p>IoT Monitoring Dashboard</p>

    </header>

    <div class="dashboard">

        <div class="left-column">

            <div class="widget">
                <h3>🌡 Temperatur</h3>
                <div class="value">22.6 °C</div>
            </div>

            <div class="widget">
                <h3>💧 Luftfeuchtigkeit</h3>
                <div class="value">58 %</div>
            </div>

            <div class="widget">
                <h3>🌱 Bodenfeuchte</h3>
                <div class="value">47 %</div>
            </div>

            <div class="widget">
                <h3>☀ Licht</h3>
                <div class="value">850 Lux</div>
            </div>

            <div class="widget status-widget">

                <h2>Status</h2>

                <p>💡 Grow-Light: EIN</p>
                <p>🚿 Pumpe: AUS</p>
                <p>📶 WLAN: Verbunden</p>

                <div class="button-group">

                    <button onclick="waterPlant()">
                        💧 Gießen
                    </button>

                    <button>
                        💡 Licht EIN
                    </button>

                    <button>
                        💡 Licht AUS
                    </button>

                </div>

            </div>

        </div>

        <div class="right-column">

            <div class="widget bonsai-widget">

                <h2>Digitales Grow Tent</h2>

                <div class="growtent-frame">

                    <div class="lamp"></div>

                   <div class="bonsai-container">

    <img
        id="bonsai"
        class="bonsai-image"
        src="images/bonsai1.png"
        alt="Bonsai">

</div>

<div class="growth-info">
    Wachstumsstadium:
    <span id="growthText">
        1 / 6
    </span>
</div>

                    

                    <div id="waterTank" class="tank">
                        💧
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
