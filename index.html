<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Grow Tent</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#1e1e1e;
    color:white;
    text-align:center;
    padding:30px;
}

.card{
    background:#2d2d2d;
    padding:20px;
    margin:20px auto;
    max-width:500px;
    border-radius:15px;
}

.value{
    font-size:30px;
    color:#4CAF50;
}
</style>

</head>
<body>

<h1>🌱 Smart Grow Tent</h1>

<div class="card">
    <h2>Temperatur</h2>
    <div class="value">22°C</div>
</div>

<div class="card">
    <h2>Luftfeuchtigkeit</h2>
    <div class="value">58%</div>
</div>

<div class="card">
    <h2>Bodenfeuchte</h2>
    <div class="value">45%</div>
</div>

<div class="card">
    <h2>Licht</h2>
    <div class="value">850 Lux</div>
</div>

</body>
</html>
